<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Aggregated metrics prototype</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f3f5;
    }

    #chart {
      width: 100%;
      height: min(72vh, 680px);
      min-height: 360px;
      background: #f7f8fb;
      border: 1px solid #d7dce5;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div id="chart"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const chartTitle = params.get("title") || "Lachesis aggregated metrics prototype";
    const xLabel = params.get("x") || "Δroam";
    const xField = params.get("field") || "delta_roam";
    const DATA_URL = "./lachesis_results.json";

    const chart = echarts.init(document.getElementById("chart"));

    fetch(DATA_URL)
      .then((res) => res.json())
      .then((data) => {
        const rows = data
          .map((d) => ({
            user_id: d.user_id,
            x: Number(d[xField]),
            recall: Number(d.recall),
          }))
          .filter((d) => Number.isFinite(d.x) && Number.isFinite(d.recall))
          .sort((a, b) => a.user_id.localeCompare(b.user_id) || a.x - b.x);

        const scatterData = rows.map((d) => [d.x, d.recall, d.user_id]);

        const grouped = new Map();
        rows.forEach((d) => {
          grouped.set(d.x, (grouped.get(d.x) || []).concat(d.recall));
        });

        const meanLine = Array.from(grouped)
          .map(([x, vals]) => [Number(x), vals.reduce((a, b) => a + b, 0) / vals.length])
          .sort((a, b) => a[0] - b[0]);

        const byUser = new Map();
        rows.forEach((d) => {
          byUser.set(d.user_id, (byUser.get(d.user_id) || []).concat(d));
        });

        const userTrajectoryData = Array.from(byUser.values())
          .map((userRows) => userRows.map((d) => [d.x, d.recall, d.user_id]).concat([[null, null, null]]))
          .flat();

        const perUserMaxData = Array.from(byUser.values())
          .map((userRows) => userRows.reduce((best, d) => (d.recall > best.recall ? d : best)))
          .map((d) => [d.x, d.recall, d.user_id]);

        const maxMean = Math.max(...meanLine.map((point) => point[1]));
        const xValues = rows.map((d) => d.x);
        const minX = Math.min(...xValues);
        const maxX = Math.max(...xValues);
        const xPadding = (maxX - minX) * 0.025;
        const maxMeanLine = [[minX, maxMean], [maxX, maxMean]];
        const maxMeanLabel = `Max mean (${maxMean.toFixed(3)})`;

        chart.setOption({
          title: {
            text: chartTitle,
            left: "center",
            top: 8,
            textStyle: {
              fontSize: 22,
              fontWeight: "normal",
            },
          },
          legend: {
            right: 18,
            bottom: 14,
            data: ["Individual results", "Mean", "Per-user max", maxMeanLabel],
            backgroundColor: "rgba(255, 255, 255, 0.9)",
            borderColor: "#ddd",
            borderWidth: 1,
            padding: 10,
            textStyle: {
              fontSize: 13,
            },
          },
          grid: {
            left: 68,
            right: 22,
            top: 54,
            bottom: 70,
            containLabel: true,
          },
          tooltip: {
            trigger: "item",
            formatter: (params) => {
              if (params.seriesType === "scatter") {
                return `${xLabel}: ${params.value[0]}<br/>recall: ${params.value[1]}<br/>user_id: ${params.value[2]}`;
              }
              if (params.seriesName === "Per-user trajectories") {
                return `user_id: ${params.value[2]}<br/>${xLabel}: ${params.value[0]}<br/>recall: ${params.value[1].toFixed(3)}`;
              }
              if (params.seriesName === maxMeanLabel) {
                return `max mean recall: ${params.value[1].toFixed(3)}`;
              }
              return `${xLabel}: ${params.value[0]}<br/>mean recall: ${params.value[1].toFixed(3)}`;
            },
          },
          toolbox: {
            feature: {
              brush: {},
              dataZoom: {},
              saveAsImage: {},
            },
          },
          brush: {
            toolbox: ["rect", "polygon", "clear"],
            xAxisIndex: 0,
          },
          xAxis: {
            type: "value",
            name: xLabel,
            nameLocation: "center",
            nameGap: 36,
            min: minX - xPadding,
            max: maxX + xPadding,
            splitLine: {
              lineStyle: {
                color: "#ddd",
                type: "dotted",
              },
            },
            axisLabel: {
              fontSize: 13,
            },
            nameTextStyle: {
              fontSize: 14,
            },
          },
          yAxis: {
            type: "value",
            name: "Recall",
            nameLocation: "center",
            nameGap: 42,
            min: 0,
            max: 1,
            splitLine: {
              lineStyle: {
                color: "#ddd",
                type: "dotted",
              },
            },
            axisLabel: {
              fontSize: 13,
            },
            nameTextStyle: {
              fontSize: 14,
            },
          },
          series: [
            {
              name: "Per-user trajectories",
              type: "line",
              data: userTrajectoryData,
              symbol: "none",
              lineStyle: {
                color: "rgba(31, 119, 180, 0.08)",
                width: 1,
              },
              z: 2,
            },
            {
              name: "Individual results",
              type: "scatter",
              data: scatterData,
              symbolSize: 7,
              itemStyle: {
                color: "rgba(31, 119, 180, 0.055)",
                borderColor: "rgba(31, 119, 180, 0.14)",
                borderWidth: 1,
              },
              z: 3,
            },
            {
              name: "Per-user max",
              type: "scatter",
              data: perUserMaxData,
              symbol: "path://M-5,-7 L0,-2 L5,-7 L7,-5 L2,0 L7,5 L5,7 L0,2 L-5,7 L-7,5 L-2,0 L-7,-5 Z",
              symbolSize: 10,
              itemStyle: {
                color: "rgba(255, 26, 26, 0.85)",
                borderColor: "rgba(255, 26, 26, 0.85)",
                borderWidth: 1,
              },
              z: 6,
            },
            {
              name: "Mean",
              type: "line",
              data: meanLine,
              symbol: "none",
              lineStyle: {
                color: "#1f77b4",
                width: 3,
                type: "solid",
              },
              itemStyle: {
                color: "#1f77b4",
              },
              z: 5,
            },
            {
              name: maxMeanLabel,
              type: "line",
              data: maxMeanLine,
              symbol: "none",
              lineStyle: {
                color: "#000",
                width: 2,
                type: "dashed",
              },
              itemStyle: {
                color: "#000",
              },
              emphasis: {
                disabled: true,
              },
            },
          ],
        });

        window.addEventListener("resize", () => chart.resize());
      });
  </script>
</body>
</html>
