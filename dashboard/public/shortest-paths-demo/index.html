<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Garden City shortest paths</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
  <style>
    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      font-family: Arial, Helvetica, sans-serif;
      color: #17202a;
      background: #eef1f4;
    }

    #chart {
      min-width: 0;
      height: 100%;
    }

    aside {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      border-left: 1px solid #ccd3dd;
      background: #f8fafc;
      box-sizing: border-box;
      overflow: auto;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .meta {
      margin: 0;
      color: #5b6470;
      font-size: 12px;
      line-height: 1.45;
    }

    .route-list {
      display: grid;
      gap: 8px;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      border: 1px solid #d6dce5;
      border-radius: 6px;
      background: #ffffff;
    }

    .legend-item {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 7px;
      color: #3e4854;
      font-size: 12px;
      text-transform: capitalize;
    }

    button {
      width: 100%;
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border: 1px solid #d6dce5;
      border-radius: 6px;
      color: inherit;
      background: #ffffff;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    button.active {
      border-color: #243447;
      box-shadow: 0 0 0 1px #243447 inset;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 999px;
    }

    .route-name {
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .route-meta {
      color: #5b6470;
      font-size: 12px;
      white-space: nowrap;
    }

    .clear {
      grid-template-columns: minmax(0, 1fr);
      justify-items: center;
      color: #243447;
      font-weight: 700;
    }

    @media (max-width: 820px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) auto;
      }

      aside {
        max-height: 42vh;
        border-top: 1px solid #ccd3dd;
        border-left: 0;
      }
    }
  </style>
</head>

<body>
  <div id="chart"></div>
  <aside>
    <div>
      <h1>Garden City Shortest Paths</h1>
      <p class="meta" id="summary"></p>
    </div>
    <div class="legend" id="typeLegend"></div>
    <div class="route-list" id="routeList"></div>
    <button class="clear" id="showAll" type="button">Show all</button>
  </aside>

  <script type="module">
    const chart = echarts.init(document.getElementById("chart"));
    const routeList = document.getElementById("routeList");
    const summary = document.getElementById("summary");
    const typeLegend = document.getElementById("typeLegend");
    const showAllButton = document.getElementById("showAll");
    const colors = ["#006d77", "#d62828", "#7b2cbf", "#f77f00", "#2a9d8f", "#3a0ca3", "#b08900", "#457b9d"];
    const typeColors = {
      home: "#2a9d8f",
      workplace: "#457b9d",
      retail: "#f4a261",
      park: "#80b918",
    };
    let activeRoute = null;
    let payload = null;

    const routeLabel = (route) => `${route.from} to ${route.to}`;
    const routeLength = (route) => `${route.blocks.length} cells`;
    const paddedBounds = (bounds) => {
      const [minX, minY, maxX, maxY] = bounds;
      const xPad = (maxX - minX) * 0.08;
      const yPad = (maxY - minY) * 0.08;
      return [minX - xPad, minY - yPad, maxX + xPad, maxY + yPad];
    };

    const pathSeries = (routes) => routes.map((route, index) => ({
      id: route.id,
      name: routeLabel(route),
      type: "lines",
      coordinateSystem: "cartesian2d",
      polyline: true,
      data: [{ coords: route.path, route }],
      lineStyle: {
        color: colors[index % colors.length],
        width: activeRoute && activeRoute !== route.id ? 2 : 4,
        opacity: activeRoute && activeRoute !== route.id ? 0.16 : 0.92,
      },
      emphasis: {
        lineStyle: {
          width: 6,
          opacity: 1,
        },
      },
      z: activeRoute === route.id ? 8 : 6,
    }));

    const buildingSeries = () => ({
      id: "buildings",
      name: "Buildings",
      type: "custom",
      coordinateSystem: "cartesian2d",
      silent: true,
      data: payload.buildings.map((_, index) => index),
      renderItem: (params, api) => {
        const building = payload.buildings[api.value(0)];
        return {
          type: "group",
          children: building.rings.map((ring) => ({
            type: "polygon",
            shape: {
              points: ring.map((point) => api.coord(point)),
            },
            style: {
              fill: typeColors[building.type] || "#cbd5e1",
              opacity: 0.42,
              stroke: typeColors[building.type] || "#94a3b8",
              lineWidth: 1,
            },
          })),
        };
      },
      z: 1,
    });

    const render = () => {
      const [minX, minY, maxX, maxY] = paddedBounds(payload.bounds);
      chart.setOption({
        animationDurationUpdate: 120,
        grid: {
          left: 24,
          right: 24,
          top: 24,
          bottom: 24,
        },
        tooltip: {
          trigger: "item",
          formatter: (params) => {
            const route = params.data?.route;
            if (route) return `${routeLabel(route)}<br/>${route.from_type} to ${route.to_type}<br/>${routeLength(route)}`;
            if (params.seriesId === "doors") return `${params.value[2]}<br/>${params.value[3]}`;
            return "";
          },
        },
        xAxis: {
          type: "value",
          min: minX,
          max: maxX,
          axisLine: { show: false },
          axisTick: { show: false },
          axisLabel: { show: false },
          splitLine: { show: false },
        },
        yAxis: {
          type: "value",
          min: minY,
          max: maxY,
          axisLine: { show: false },
          axisTick: { show: false },
          axisLabel: { show: false },
          splitLine: { show: false },
        },
        series: [
          {
            id: "streets",
            name: "Street cells",
            type: "lines",
            coordinateSystem: "cartesian2d",
            polyline: true,
            silent: true,
            data: payload.streets.map((street) => ({ coords: street.coords })),
            lineStyle: {
              color: "#546a7b",
              width: 1,
              opacity: 0.5,
            },
            z: 2,
          },
          buildingSeries(),
          ...pathSeries(payload.routes),
          {
            id: "doors",
            name: "Building doors",
            type: "scatter",
            data: payload.doors.map((door) => [door.x, door.y, door.id, door.type]),
            symbolSize: 7,
            itemStyle: {
              color: (params) => typeColors[params.value[3]] || "#111827",
              borderColor: "#ffffff",
              borderWidth: 1,
            },
            label: {
              show: false,
              formatter: (params) => params.value[2],
              position: "right",
              color: "#17202a",
              fontSize: 11,
            },
            emphasis: {
              scale: 1.8,
              label: {
                show: true,
              },
            },
            z: 10,
          },
        ],
      }, true);
    };

    const syncRouteList = () => {
      routeList.innerHTML = "";
      payload.routes.forEach((route, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = activeRoute === route.id ? "active" : "";
        button.innerHTML = `
          <span class="swatch" style="background:${colors[index % colors.length]}"></span>
          <span class="route-name">${routeLabel(route)}</span>
          <span class="route-meta">${routeLength(route)}</span>
        `;
        button.addEventListener("click", () => {
          activeRoute = activeRoute === route.id ? null : route.id;
          syncRouteList();
          render();
        });
        routeList.appendChild(button);
      });
    };

    const renderTypeLegend = () => {
      typeLegend.innerHTML = Object.entries(typeColors).map(([type, color]) => `
        <span class="legend-item">
          <span class="swatch" style="background:${color}"></span>
          ${type}
        </span>
      `).join("");
    };

    fetch("./routes.json")
      .then((response) => response.json())
      .then((metadata) => {
        payload = metadata;
        summary.textContent = `${payload.routes.length} sampled routes, ${payload.buildings.length} buildings, ${payload.doors.length} doors. ${payload.source}.`;
        renderTypeLegend();
        syncRouteList();
        render();
      });

    showAllButton.addEventListener("click", () => {
      activeRoute = null;
      syncRouteList();
      render();
    });
    window.addEventListener("resize", () => chart.resize());
  </script>
</body>
</html>
