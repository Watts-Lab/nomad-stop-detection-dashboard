<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo1 recreated - Beijing flight routes</title>
    <link rel="stylesheet" href="../leaflet/leaflet.css">
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b1524;
            font-family: Arial, Helvetica, sans-serif;
        }

        .leaflet-container {
            background: #182231;
        }
    </style>
</head>
<body>
<div id="map"></div>

<script src="../dist/main.min.js"></script>
<script>
    var map = L.map('map', {
        zoomControl: true,
        attributionControl: true
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', {
        subdomains: 'abcd',
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    // Coordinates are [longitude, latitude]. The Leaflet/ECharts bridge converts
    // these through map.latLngToContainerPoint, so points stay locked to the map.
    var geoCoordMap = {
        Beijing: [116.4074, 39.9042],
        Shanghai: [121.4737, 31.2304],
        Guangzhou: [113.2644, 23.1291],
        Dalian: [121.6147, 38.9140],
        Nanning: [108.3669, 22.8170],
        Nanchang: [115.8582, 28.6820],
        Lhasa: [91.1322, 29.6604],
        Changchun: [125.3235, 43.8171],
        Baotou: [109.8403, 40.6574],
        Chongqing: [106.5516, 29.5630],
        Changzhou: [119.9741, 31.8112]
    };

    var flightData = [
        [{ name: 'Beijing' }, { name: 'Shanghai', value: 95 }],
        [{ name: 'Beijing' }, { name: 'Guangzhou', value: 90 }],
        [{ name: 'Beijing' }, { name: 'Dalian', value: 80 }],
        [{ name: 'Beijing' }, { name: 'Nanning', value: 70 }],
        [{ name: 'Beijing' }, { name: 'Nanchang', value: 60 }],
        [{ name: 'Beijing' }, { name: 'Lhasa', value: 50 }],
        [{ name: 'Beijing' }, { name: 'Changchun', value: 40 }],
        [{ name: 'Beijing' }, { name: 'Baotou', value: 30 }],
        [{ name: 'Beijing' }, { name: 'Chongqing', value: 20 }],
        [{ name: 'Beijing' }, { name: 'Changzhou', value: 10 }]
    ];

    var routeBounds = L.latLngBounds(flightData.reduce(function (points, item) {
        return points.concat(item.map(function (city) {
            var coord = geoCoordMap[city.name];
            return L.latLng(coord[1], coord[0]);
        }));
    }, []));

    map.fitBounds(routeBounds, {
        paddingTopLeft: [90, 90],
        paddingBottomRight: [190, 90]
    });

    var overlay = new L.echartsLayer3(map, echarts);
    var chart = overlay.initECharts(overlay.getEchartsContainer());

    function syncEchartsLayer() {
        var size = map.getSize();
        var panePos = map._getMapPanePos ? map._getMapPanePos() : L.point(0, 0);
        var container = overlay.getEchartsContainer();
        container.style.width = size.x + 'px';
        container.style.height = size.y + 'px';
        container.style.left = (-parseInt(panePos.x, 10) || 0) + 'px';
        container.style.top = (-parseInt(panePos.y, 10) || 0) + 'px';
        chart.resize();
    }

    var planePath = 'path://M1705.06,1318.313v-89.254l-319.9-221.799l0.073-208.063c0.521-84.662-26.629-121.796-63.961-121.491c-37.332-0.305-64.482,36.829-63.961,121.491l0.073,208.063l-319.9,221.799v89.254l330.343-157.288l12.238,241.308l-134.449,92.931l0.531,42.034l175.125-42.917l175.125,42.917l0.531-42.034l-134.449-92.931l12.238-241.308L1705.06,1318.313z';

    function convertRoutes(data) {
        return data.map(function (item) {
            return [
                { coord: geoCoordMap[item[0].name] },
                { coord: geoCoordMap[item[1].name] }
            ];
        });
    }

    function convertDestinations(data) {
        return data.map(function (item) {
            var destination = item[1];
            return {
                name: destination.name,
                value: geoCoordMap[destination.name].concat([destination.value])
            };
        });
    }

    var routeColor = '#46bee9';

    var option = {
        title: {
            text: 'Beijing Flight Routes',
            subtext: 'Leaflet + ECharts3 demo1 recreation',
            left: 'center',
            top: 18,
            textStyle: {
                color: '#ffffff',
                fontSize: 22,
                fontWeight: 'normal'
            },
            subtextStyle: {
                color: 'rgba(255, 255, 255, 0.72)'
            }
        },
        tooltip: {
            trigger: 'item',
            formatter: function (params) {
                if (params.seriesType === 'effectScatter') {
                    return params.name + '<br/>value: ' + params.value[2];
                }
                return 'Beijing route';
            }
        },
        geo: {
            map: '',
            roam: true,
            label: {
                emphasis: {
                    show: false
                }
            },
            itemStyle: {
                normal: {
                    areaColor: '#323c48',
                    borderColor: '#404a59'
                },
                emphasis: {
                    areaColor: '#2a333d'
                }
            }
        },
        series: [
            {
                name: 'Route glow',
                type: 'lines',
                coordinateSystem: 'geo',
                zlevel: 1,
                effect: {
                    show: true,
                    period: 6,
                    trailLength: 0.7,
                    color: '#ffffff',
                    symbolSize: 3
                },
                lineStyle: {
                    normal: {
                        color: routeColor,
                        width: 0,
                        curveness: 0.2
                    }
                },
                data: convertRoutes(flightData)
            },
            {
                name: 'Animated planes',
                type: 'lines',
                coordinateSystem: 'geo',
                zlevel: 2,
                effect: {
                    show: true,
                    period: 6,
                    trailLength: 0,
                    symbol: planePath,
                    symbolSize: 15
                },
                lineStyle: {
                    normal: {
                        color: routeColor,
                        width: 1,
                        opacity: 0.45,
                        curveness: 0.2
                    }
                },
                data: convertRoutes(flightData)
            },
            {
                name: 'Destinations',
                type: 'effectScatter',
                coordinateSystem: 'geo',
                zlevel: 3,
                rippleEffect: {
                    brushType: 'stroke'
                },
                label: {
                    normal: {
                        show: true,
                        position: 'right',
                        formatter: '{b}'
                    }
                },
                symbolSize: function (val) {
                    return Math.max(7, val[2] / 8);
                },
                itemStyle: {
                    normal: {
                        color: routeColor
                    }
                },
                data: convertDestinations(flightData)
            }
        ]
    };

    overlay.setOption(option);
    syncEchartsLayer();
    setTimeout(syncEchartsLayer, 0);
    map.on('moveend resize viewreset', syncEchartsLayer);
    window.addEventListener('resize', syncEchartsLayer);
</script>
</body>
</html>
