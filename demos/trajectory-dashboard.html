<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trajectory Dashboard</title>
    <link rel="stylesheet" href="assets/leaflet.css">
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background: #08131f;
            color: #eef6ff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .leaflet-container {
            background: #101b29;
        }

        .leaflet-control-attribution {
            background: rgba(8, 19, 31, 0.72);
            color: rgba(238, 246, 255, 0.72);
        }

        .hud {
            position: absolute;
            z-index: 800;
            top: 20px;
            left: 22px;
            display: grid;
            gap: 12px;
            width: min(360px, calc(100vw - 44px));
            pointer-events: none;
        }

        .title {
            padding: 16px 18px 14px;
            border: 1px solid rgba(107, 213, 255, 0.22);
            border-radius: 8px;
            background: linear-gradient(180deg, rgba(8, 19, 31, 0.86), rgba(8, 19, 31, 0.58));
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(12px);
        }

        .title h1 {
            margin: 0 0 6px;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0;
        }

        .title p {
            margin: 0;
            color: rgba(238, 246, 255, 0.72);
            font-size: 12px;
            line-height: 1.45;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
        }

        .stat {
            min-width: 0;
            padding: 10px 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            background: rgba(8, 19, 31, 0.72);
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.24);
            backdrop-filter: blur(10px);
        }

        .stat strong {
            display: block;
            overflow: hidden;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .stat span {
            display: block;
            overflow: hidden;
            margin-top: 4px;
            color: rgba(238, 246, 255, 0.66);
            font-size: 10px;
            text-transform: uppercase;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .legend {
            position: absolute;
            z-index: 800;
            right: 22px;
            bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-width: min(520px, calc(100vw - 44px));
            pointer-events: none;
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 9px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            background: rgba(8, 19, 31, 0.68);
            color: rgba(238, 246, 255, 0.76);
            font-size: 11px;
            backdrop-filter: blur(10px);
        }

        .legend i {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 999px;
        }

        @media (max-width: 680px) {
            .hud {
                top: 12px;
                left: 12px;
                width: calc(100vw - 24px);
            }

            .title {
                padding: 13px 14px;
            }

            .title h1 {
                font-size: 17px;
            }

            .stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .legend {
                right: 12px;
                bottom: 18px;
            }
        }
    </style>
</head>
<body>
<div id="map"></div>
<section class="hud" aria-label="Trajectory overview">
    <div class="title">
        <h1>Nomad Trajectories</h1>
        <p id="subtitle">Leaflet + ECharts animated traces</p>
    </div>
    <div class="stats">
        <div class="stat"><strong id="stat-users">-</strong><span>Users</span></div>
        <div class="stat"><strong id="stat-routes">-</strong><span>Routes</span></div>
        <div class="stat"><strong id="stat-segments">-</strong><span>Segments</span></div>
        <div class="stat"><strong id="stat-stops">-</strong><span>Stops</span></div>
    </div>
</section>
<div class="legend" aria-label="Map legend">
    <span><i style="background:#46bee9"></i>Flow trail</span>
    <span><i style="background:#ffffff"></i>Moving pulse</span>
    <span><i style="background:#f6d365"></i>Stops</span>
</div>

<script src="assets/leaflet-echarts3-main.min.js"></script>
<script src="data/trajectory_payload.js"></script>
<script>
    var payload = window.TRAJECTORY_PAYLOAD;

    var map = L.map('map', {
        zoomControl: true,
        attributionControl: true,
        preferCanvas: true
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', {
        subdomains: 'abcd',
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    var bounds = payload.bounds;
    map.fitBounds([
        [bounds.south, bounds.west],
        [bounds.north, bounds.east]
    ], {
        paddingTopLeft: [90, 120],
        paddingBottomRight: [80, 80],
        maxZoom: 15
    });

    document.getElementById('subtitle').textContent = payload.date + ' | ' + payload.summary.pointStride + 'x sampled full trajectory';
    document.getElementById('stat-users').textContent = payload.summary.users.toLocaleString();
    document.getElementById('stat-routes').textContent = payload.summary.routes.toLocaleString();
    document.getElementById('stat-segments').textContent = payload.summary.segments.toLocaleString();
    document.getElementById('stat-stops').textContent = payload.summary.stops.toLocaleString();

    var overlay = new L.echartsLayer3(map, echarts);
    var chart = overlay.initECharts(overlay.getEchartsContainer());
    var echartsContainer = overlay.getEchartsContainer();
    echartsContainer.style.pointerEvents = 'none';
    window.nomadMap = map;
    window.nomadChart = chart;
    window.nomadOverlay = overlay;

    function syncEchartsLayer() {
        var size = map.getSize();
        var panePos = map._getMapPanePos ? map._getMapPanePos() : L.point(0, 0);
        var container = echartsContainer;
        container.style.width = size.x + 'px';
        container.style.height = size.y + 'px';
        container.style.left = (-parseInt(panePos.x, 10) || 0) + 'px';
        container.style.top = (-parseInt(panePos.y, 10) || 0) + 'px';
        container.style.visibility = 'visible';
        container.style.pointerEvents = 'none';
        chart.resize();
    }

    function redrawEchartsLayer() {
        syncEchartsLayer();
        chart.clear();
        chart.setOption(option, true);
        syncEchartsLayer();
    }

    function routeSegments() {
        return payload.segments.map(function (segment) {
            return [
                { name: segment.name, coord: segment.coords[0] },
                { name: segment.name, coord: segment.coords[1], value: segment.value }
            ];
        });
    }

    var movingSymbol = 'circle';

    var option = {
        tooltip: {
            trigger: 'item',
            backgroundColor: 'rgba(8, 19, 31, 0.9)',
            borderColor: 'rgba(107, 213, 255, 0.34)',
            textStyle: { color: '#eef6ff' },
            formatter: function (params) {
                if (params.seriesName === 'Stops') {
                    return params.data.user + '<br/>' + params.name + '<br/>duration: ' + params.value[2] + ' min';
                }
                if (params.seriesType === 'effectScatter') {
                    return params.name;
                }
                return params.name + '<br/>segment: ' + params.value + ' sec';
            }
        },
        geo: {
            map: '',
            roam: true,
            silent: true,
            label: { emphasis: { show: false } },
            itemStyle: {
                normal: { areaColor: '#182231', borderColor: '#2d4058' },
                emphasis: { areaColor: '#1c2a3b' }
            }
        },
        series: [
            {
                name: 'Route haze',
                type: 'lines',
                coordinateSystem: 'geo',
                zlevel: 1,
                effect: {
                    show: true,
                    period: 7,
                    trailLength: 0.72,
                    color: '#ffffff',
                    symbolSize: 2.2
                },
                lineStyle: {
                    normal: {
                        color: '#46bee9',
                        width: 0,
                        opacity: 0,
                        curveness: 0
                    }
                },
                data: routeSegments()
            },
            {
                name: 'Trajectories',
                type: 'lines',
                coordinateSystem: 'geo',
                zlevel: 2,
                effect: {
                    show: true,
                    period: 4.8,
                    trailLength: 0,
                    symbol: movingSymbol,
                    symbolSize: 6
                },
                lineStyle: {
                    normal: {
                        color: '#46bee9',
                        width: 1.1,
                        opacity: 0.36,
                        curveness: 0
                    }
                },
                data: routeSegments()
            },
            {
                name: 'Stops',
                type: 'effectScatter',
                coordinateSystem: 'geo',
                zlevel: 3,
                rippleEffect: {
                    brushType: 'stroke',
                    period: 5,
                    scale: 2.8
                },
                symbolSize: function (value) {
                    return Math.max(5, Math.min(18, Math.sqrt(value[2]) * 0.62));
                },
                itemStyle: {
                    normal: {
                        color: '#f6d365',
                        shadowBlur: 14,
                        shadowColor: 'rgba(246, 211, 101, 0.42)'
                    }
                },
                data: payload.stops
            },
            {
                name: 'Starts',
                type: 'effectScatter',
                coordinateSystem: 'geo',
                zlevel: 4,
                rippleEffect: { brushType: 'stroke', period: 6, scale: 2 },
                symbolSize: 4,
                itemStyle: { normal: { color: '#8ef2c2' } },
                data: payload.starts
            },
            {
                name: 'Ends',
                type: 'effectScatter',
                coordinateSystem: 'geo',
                zlevel: 4,
                rippleEffect: { brushType: 'stroke', period: 6, scale: 2.4 },
                symbolSize: 5,
                itemStyle: { normal: { color: '#ff7c7c' } },
                data: payload.ends
            }
        ]
    };

    overlay.setOption(option);
    syncEchartsLayer();
    setTimeout(syncEchartsLayer, 0);
    map.on('moveend resize', function () {
        syncEchartsLayer();
        setTimeout(syncEchartsLayer, 0);
    });
    map.on('zoomend viewreset', function () {
        redrawEchartsLayer();
        setTimeout(redrawEchartsLayer, 0);
    });
    window.addEventListener('resize', syncEchartsLayer);
</script>
</body>
</html>
