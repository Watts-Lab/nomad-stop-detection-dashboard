<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1040" viewBox="0 0 1680 1040" role="img" aria-labelledby="title desc">
  <title id="title">Ground truth trajectory placeholder</title>
  <desc id="desc">Map and timeline placeholder matching the issue mockup layout.</desc>

  <defs>
    <style>
      .bg { fill: #eeeeee; }
      .frame { fill: #e9e9e9; stroke: #bdbdbd; stroke-width: 2; }
      .room-dark { fill: #8f8f8f; }
      .room-light { fill: #b8b8ba; }
      .wall { stroke: #f5f5f5; stroke-width: 3; fill: none; }
      .text { font: 700 20px "Helvetica Neue", Arial, sans-serif; fill: #2c2c2c; }
      .barcode { stroke: #1c1c1c; stroke-width: 4; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1680" height="1040" />
  <rect class="frame" x="24" y="24" width="1632" height="992" rx="12" />

  <g transform="translate(330,140)">
    <text class="text" x="390" y="-20" text-anchor="middle">2024-06-01 05:40:58</text>

    <rect class="room-dark" x="0" y="0" width="520" height="150" />
    <rect class="room-light" x="520" y="0" width="260" height="720" />
