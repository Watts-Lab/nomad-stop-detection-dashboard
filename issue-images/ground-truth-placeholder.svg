    <circle cx="470" cy="460" r="160" fill="none" stroke="#ea7a39" stroke-width="11" opacity="0.95" />
    <circle cx="1188" cy="160" r="100" fill="none" stroke="#8f2e95" stroke-width="10" opacity="0.95" />

    <g fill="#c13f60">
      <circle cx="190" cy="450" r="6"/><circle cx="230" cy="465" r="6"/><circle cx="250" cy="440" r="6"/>
      <circle cx="300" cy="430" r="6"/><circle cx="332" cy="460" r="6"/><circle cx="430" cy="470" r="6"/>
      <circle cx="620" cy="620" r="6"/><circle cx="474" cy="545" r="6"/><circle cx="292" cy="540" r="6"/>
